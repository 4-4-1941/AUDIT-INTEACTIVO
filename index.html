<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a2e44">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AUDIT - SIP SYSTEM</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <header class="app-header">
        <div class="logo-sip">
            <img src="logo-sidebar.png" alt="SIP SYSTEM" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">
                <span class="sip">SIP</span>
                <span class="system">SYSTEM</span>
            </div>
        </div>
        <div class="app-title">AUDIT <small>OMS · 2001</small></div>
    </header>
    <main class="app-body">
        <div class="disclaimer"><strong>⚕️ Aviso:</strong> Tamizaje preventivo. Los resultados <strong>NO</strong> son diagnóstico médico.</div>
        <div class="progreso">
            <span class="contador" id="contadorPregunta">Pregunta 1/10</span>
            <div class="barra-container"><div class="barra" id="barraProgreso"></div></div>
            <span class="pregunta-num" id="textoProgreso">0%</span>
        </div>
        <div class="guia-trago"><strong>🥃 Referencia:</strong> 1 trago = 10g alcohol</div>
        <div class="pregunta-container" id="preguntaContainer"></div>
        <div class="nav-buttons">
            <button class="btn-prev" id="btnPrev" onclick="cambiarPregunta(-1)">← Anterior</button>
            <button class="btn-next" id="btnNext" onclick="cambiarPregunta(1)">Siguiente →</button>
            <button class="btn-calcular" id="btnCalcular" onclick="calcularAudit()" style="display:none;">📊 Resultado</button>
        </div>
        <div id="resultadoBox" class="resultado"></div>
    </main>
    <footer class="app-footer">
        <strong>© 2026 SIP SYSTEM INTELLIGENCE PLATFORM</strong><br>
        Basado en manual OMS (2001) <span class="version">· v2.0</span>
    </footer>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
